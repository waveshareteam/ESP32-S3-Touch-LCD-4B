name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate repository
        run: python scripts/check_repository.py

      - name: Validate release helpers
        run: |
          python releases/package_firmware.py --help
          python releases/download_artifacts.py --help
          python -m py_compile releases/package_firmware.py releases/download_artifacts.py releases/download_artifacts_impl.py
