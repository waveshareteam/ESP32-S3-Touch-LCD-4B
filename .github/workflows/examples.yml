name: Build Examples

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - ".github/workflows/examples.yml"
      - "scripts/discover_examples.py"
      - "releases/**"
      - "examples/esp-idf/**"
      - "examples/arduino/**"
  pull_request:
    paths:
      - ".github/workflows/examples.yml"
      - "scripts/discover_examples.py"
      - "releases/**"
      - "examples/esp-idf/**"
      - "examples/arduino/**"
  workflow_dispatch:
    inputs:
      target:
        description: "all, an example name, or a repo-relative example path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-esp-idf:
    name: Discover ESP-IDF examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          python3 scripts/discover_examples.py \
            --surface esp-idf \
            --selector "${{ github.event.inputs.target || 'all' }}" \
            --idf-versions v5.5.5,v6.0.2 \
            --github-output "$GITHUB_OUTPUT"

  build-esp-idf:
    name: ${{ matrix.idf }} / ${{ matrix.name }}
    needs: discover-esp-idf
    if: needs.discover-esp-idf.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-esp-idf.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C "${{ matrix.path }}" -B "build/${{ matrix.name }}-${{ matrix.idf }}" set-target esp32s3 build
      - name: Package firmware
        shell: bash
        run: |
          python3 releases/package_firmware.py \
            --framework esp-idf \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.idf }}" \
            --name "ESP32-S3-Touch-LCD-4B-${{ matrix.name }}-${{ matrix.idf }}" \
            --framework-version "${{ matrix.idf }}" \
            --target esp32s3 \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  discover-arduino:
    name: Discover Arduino sketches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          python3 scripts/discover_examples.py \
            --surface arduino \
            --selector "${{ github.event.inputs.target || 'all' }}" \
            --arduino-core 3.3.11 \
            --fqbn "esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi" \
            --github-output "$GITHUB_OUTPUT"

  build-arduino:
    name: ${{ matrix.name }}
    needs: discover-arduino
    if: needs.discover-arduino.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-arduino.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.0"
      - name: Cache Arduino packages
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ matrix.core }}-${{ runner.os }}
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@${{ matrix.core }} \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile ${{ matrix.path }}
        shell: bash
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --libraries examples/arduino/libraries \
            --build-property "compiler.c.extra_flags=-I${{ github.workspace }}/examples/arduino/libraries" \
            --build-property "compiler.cpp.extra_flags=-I${{ github.workspace }}/examples/arduino/libraries" \
            --export-binaries \
            --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            "${{ matrix.path }}"
      - name: Package firmware
        shell: bash
        run: |
          python3 releases/package_firmware.py \
            --framework arduino \
            --project "${{ matrix.path }}" \
            --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" \
            --name "ESP32-S3-Touch-LCD-4B-${{ matrix.name }}-arduino-${{ matrix.core }}" \
            --framework-version "${{ matrix.core }}" \
            --target esp32s3 \
            --git-sha "${{ github.sha }}" \
            --output-dir release-artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error
